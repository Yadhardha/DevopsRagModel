name: DevOps RAG Model

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      steps:
        - name: Generate logs
          run: |
            mkdir -p logs
      
            echo "Starting pipeline..." > logs/pipeline.log
            echo "Docker build failed ..." >> logs/pipeline.log
      
            exit 1

        - name: Upload logs
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: pipeline-logs
            path: logs/pipeline.log
